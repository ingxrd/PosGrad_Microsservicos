server.port=${SERVER_PORT:8080}

aluno.service.url=${ALUNO_SERVICE_URL}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.h2.console.enabled=false

spring.cloud.openfeign.client.config.aluno-service.connect-timeout=${ALUNO_CONNECT_TIMEOUT:2000}
spring.cloud.openfeign.client.config.aluno-service.read-timeout=${ALUNO_READ_TIMEOUT:3000}