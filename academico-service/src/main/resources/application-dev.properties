server.port=${SERVER_PORT:8080}

aluno.service.url=${ALUNO_SERVICE_URL:http://localhost:8081}

spring.datasource.url=jdbc:h2:mem:arquiteturadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.cloud.openfeign.client.config.aluno-service.connectTimeout=${ALUNO_CONNECT_TIMEOUT:2000}
spring.cloud.openfeign.client.config.aluno-service.readTimeout=${ALUNO_READ_TIMEOUT:3000}